name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # golden 曾因 toLocaleString 跨時區不一致而失效（PR #1），兩個時區都要過
        tz: [UTC, Asia/Taipei]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test（零相依）
        run: node --test
